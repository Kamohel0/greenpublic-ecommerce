<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Order Confirmation</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
        margin: 0;
        padding: 0;
      }
      .container {
        max-width: 600px;
        margin: 20px auto;
        background: #fff;
        padding: 20px;
        border-radius: 8px;
      }
      h1 {
        color: #333;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th,
      td {
        padding: 10px;
        border-bottom: 1px solid #ddd;
        text-align: left;
      }
      .total {
        font-weight: bold;
      }
      .footer {
        margin-top: 20px;
        font-size: 12px;
        color: #777;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Order Confirmation</h1>
      <p>Dear <span th:text="${customerName}">Customer</span>,</p>
      <p>Thank you for your order! Here are your order details:</p>

      <table>
        <thead>
          <tr>
            <th>Product</th>
            <th>Quantity</th>
            <th>Price</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="item : ${orderItems}">
            <td th:text="${item.name}">Product Name</td>
            <td th:text="${item.quantity}">1</td>
            <td th:text="${item.price}">100.00</td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <td colspan="2" class="total">Total:</td>
            <td th:text="${totalAmount}">0.00</td>
          </tr>
        </tfoot>
      </table>

      <p>Order ID: <span th:text="${orderId}">12345</span></p>
      <p>Order Date: <span th:text="${orderDate}">2025-08-20</span></p>

      <p class="footer">Thank you for shopping with us!</p>
    </div>
  </body>
</html>
