# ===== Production Configuration =====

# ===== Spring / JPA Configuration =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# ===== Logging Configuration =====
logging.level.com.greenpublic.ecommerce=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.file.name=logs/application.log
logging.file.max-size=100MB
logging.file.max-history=30

# ===== Server Configuration =====
server.error.include-stacktrace=never
server.error.include-message=always
server.compression.enabled=true
server.compression.min-response-size=1024

# ===== AWS Configuration =====
# AWS Region Configuration
cloud.aws.region.static=af-south-1

# S3 Configuration
cloud.aws.s3.bucket=${AWS_S3_BUCKET:green-public-prod}
cloud.aws.s3.region=af-south-1
cloud.aws.s3.accelerationEnabled=false

# CloudFront Configuration
cloud.aws.cloudFront.distributionDomain=${CLOUDFRONT_DOMAIN:}
cloud.aws.cloudFront.keyPairId=${CLOUDFRONT_KEY_PAIR_ID:}
cloud.aws.cloudFront.privateKeyPath=${CLOUDFRONT_PRIVATE_KEY_PATH:/etc/greenpublic/cloudfront-private-key.pem}
cloud.aws.cloudFront.urlExpirationMinutes=60

# CloudWatch Configuration
cloud.aws.cloudWatch.metricsEnabled=true
cloud.aws.cloudWatch.namespace=GreenPublic/Ecommerce
cloud.aws.cloudWatch.batchSize=20

# ===== S3 Service Configuration =====
app.s3.product-images-path=images/products/
app.s3.max-file-size=5242880
app.s3.allowed-image-types=image/jpeg,image/png,image/webp,image/gif

# ===== Public Base URL (for Yoco redirect URLs) =====
app.public.base-url=https://greenpublic.duckdns.org

# ===== Frontend URL / CORS =====
app.frontend.url=https://greenpublic.duckdns.org
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://greenpublic.duckdns.org}

# ===== Google OAuth redirect =====
spring.security.oauth2.client.registration.google.redirect-uri=https://greenpublic.duckdns.org/api/login/oauth2/code/google

# ===== JWT Configuration =====
jwt.secret=${JWT_SECRET}
jwt.issuer=ecommerce-api
jwt.audience=frontend
jwt.accessExpirationMs=900000
jwt.refreshExpirationMs=604800000
jwt.clockSkewSec=30

# ===== Database Configuration =====
# Set via environment variables for security
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== Email Configuration (Gmail SMTP or AWS SES) =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.from=${MAIL_FROM:${MAIL_USERNAME}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ===== Registration / Email Verification =====
app.registration.activate-immediately=false
app.registration.verification-timeout-hours=24
app.registration.allow-reregister=true

# ===== Caching Configuration =====
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100000,expireAfterWrite=30d

# ===== Rate Limiting =====
rate.limit.login.attempts=10
rate.limit.login.duration=1m
rate.limit.refresh.attempts=20
rate.limit.refresh.duration=1m
rate.limit.register.attempts=5
rate.limit.register.duration=1h

# ===== Management Endpoints =====
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=when-authorized
management.endpoint.metrics.enabled=true
management.endpoint.info.enabled=true

