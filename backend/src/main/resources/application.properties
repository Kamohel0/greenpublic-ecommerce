spring.application.name=ecommerce

# Secrets are never stored in this file. Provide them as environment variables
# or in a .env file next to the jar (see backend/.env.example).
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect.storage_engine=innodb
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# AWS Configuration (local development - disabled)
aws.region=af-south-1
spring.cloud.aws.s3.enabled=false
spring.cloud.aws.sns.enabled=false
spring.cloud.aws.sqs.enabled=false
spring.cloud.aws.secrets-manager.enabled=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=8080

jwt.secret=${JWT_SECRET}
jwt.issuer=ecommerce-api
jwt.audience=frontend
jwt.accessExpirationMs=900000
jwt.refreshExpirationMs=604800000
jwt.clockSkewSec=30

management.endpoints.web.exposure.include=health,metrics,info
# management.endpoint.health.show-details=when_authorized
management.endpoint.metrics.enabled=true
management.endpoint.info.enabled=true

logging.level.com.greenpublic.ecommerce=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.file.name=logs/application.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

rate.limit.login.attempts=10
rate.limit.login.duration=1m
rate.limit.refresh.attempts=20
rate.limit.refresh.duration=1m
rate.limit.register.attempts=5
rate.limit.register.duration=1h

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100000,expireAfterWrite=30d

spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=async-

server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

yoco.api.secret-key=${YOCO_API_SECRET_KEY}
yoco.api.public-key=${YOCO_API_PUBLIC_KEY}

yoco.webhook.url=${YOCO_WEBHOOK_URL:http://localhost:8080/api/webhook/yoco}
yoco.webhook.secret=${YOCO_WEBHOOK_SECRET}
cart.low-stock-threshold=5

reservation.expiryMinutes=10

orders.cleanup.enabled=true
orders.cleanup.fixedDelay=60000
orders.cleanup.initialDelay=15000
orders.cleanup.pageSize=500

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.upload.image-dir=uploads/images
app.upload.public-base=/images
app.upload.max-image-bytes=5242880

cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}
cloud.aws.region.static=${AWS_REGION:af-south-1}
cloud.aws.s3.bucket=${AWS_S3_BUCKET:greenpublicimages}

app.public.base-url=${PUBLIC_BASE_URL:http://localhost:8080}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# CORS Configuration (production origins are set in application-prod.properties)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

security.password-reset.expiration-hours=1
security.password-reset.max-attempts=10
security.password-reset.attempt-ttl=24

app.security.password.min-length=8
app.security.password.common=password,123456,123456789,qwerty,letmein,welcome,admin

app.registration.rate-limit.ip=15
app.registration.rate-limit.email=10
app.registration.activate-immediately=false
app.registration.verification-timeout-hours=24
app.registration.auto-cleanup-days=7
app.registration.allow-reregister=true

app.login.rate-limit.ip=50
app.login.rate-limit.email=15
app.login.max-attempts=10
app.login.lockout-minutes=20
app.login.allow-password-check=true
app.security.alert.enabled=true

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:default-client-id-placeholder}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:default-client-secret-placeholder}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.client-authentication-method=client_secret_basic

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs